services:
  obsidian-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: obsidian-mcp:latest
    container_name: obsidian-mcp
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${MCP_PORT:-8080}:8080"
    volumes:
      - "/path/to/your/vault:/vault:rw"
    environment:
      - OBSIDIAN_VAULT_PATH=/vault
      - OBSIDIAN_MCP_HTTP=0.0.0.0:8080
      - OBSIDIAN_MCP_API_KEY=${OBSIDIAN_MCP_API_KEY:-}
      - TZ=${TZ:-UTC}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

